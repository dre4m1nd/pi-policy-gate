name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: typecheck, simulate, test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Typecheck
        run: bun run typecheck
      - name: Simulate policy corpus
        run: bun run simulate
      - name: Test suite
        run: bun run test
